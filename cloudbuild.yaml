steps:
  # 1. Build Docker image with target tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/event-data-hub:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/event-data-hub:latest'
      - '.'

  # 2. Push image to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/event-data-hub:$COMMIT_SHA'

  # 3. Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'event-data-hub'
      - '--image=gcr.io/$PROJECT_ID/event-data-hub:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=DATA_STORE=firestore,NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/event-data-hub:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/event-data-hub:latest'
